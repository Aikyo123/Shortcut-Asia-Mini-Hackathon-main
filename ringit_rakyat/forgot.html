<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password – RingitRakyat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">🔐</div>
      <h1>RingitRakyat</h1>
    </div>

    <!-- STEP 1: Enter Email -->
    <div id="step1">
      <h2 class="auth-title">Forgot Password?</h2>
      <p class="auth-sub">Enter your email and we'll send a 6-digit OTP code</p>
      <div class="alert" id="alert1"></div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="fpEmail" placeholder="student@email.com">
      </div>
      <button class="btn btn-primary" id="sendBtn" onclick="sendOTP()">Send OTP Code</button>
      <div class="auth-links"><a href="login.html">← Back to Login</a></div>
    </div>

    <!-- STEP 2: Enter OTP -->
    <div id="step2" style="display:none">
      <h2 class="auth-title">Check Your Email 📬</h2>
      <p class="auth-sub">Enter the 6-digit OTP sent to <strong id="emailDisplay"></strong></p>

      <div class="alert" id="alert2"></div>

      <!-- Demo OTP display -->
      <div class="alert alert-info show" id="demoOTPBox" style="display:none!important; font-family:var(--mono); font-size:18px; text-align:center; letter-spacing:6px; font-weight:700;">
        Demo OTP: <span id="demoOTP"></span>
      </div>

      <div class="otp-input-group">
        <input type="text" maxlength="1" class="otp-digit" id="o1" oninput="otpNext(this,'o2')">
        <input type="text" maxlength="1" class="otp-digit" id="o2" oninput="otpNext(this,'o3')" onkeydown="otpBack(event,this,'o1')">
        <input type="text" maxlength="1" class="otp-digit" id="o3" oninput="otpNext(this,'o4')" onkeydown="otpBack(event,this,'o2')">
        <input type="text" maxlength="1" class="otp-digit" id="o4" oninput="otpNext(this,'o5')" onkeydown="otpBack(event,this,'o3')">
        <input type="text" maxlength="1" class="otp-digit" id="o5" oninput="otpNext(this,'o6')" onkeydown="otpBack(event,this,'o4')">
        <input type="text" maxlength="1" class="otp-digit" id="o6" oninput="otpNext(this,null)" onkeydown="otpBack(event,this,'o5')">
      </div>

      <button class="btn btn-primary" id="verifyBtn" onclick="verifyOTP()">Verify OTP</button>
      <div class="auth-links">
        Didn't receive? <a href="#" onclick="resendOTP()">Resend OTP</a>
      </div>
    </div>

    <!-- STEP 3: New Password -->
    <div id="step3" style="display:none">
      <h2 class="auth-title">New Password 🔑</h2>
      <p class="auth-sub">Choose a strong new password</p>
      <div class="alert" id="alert3"></div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newpass" placeholder="Minimum 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="newpass2" placeholder="Repeat new password">
      </div>
      <button class="btn btn-primary" id="resetBtn" onclick="resetPassword()">Reset Password</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
let currentEmail = '';

function showStep(n) {
  [1,2,3].forEach(i => document.getElementById('step'+i).style.display = i === n ? 'block' : 'none');
}

async function sendOTP() {
  const btn   = document.getElementById('sendBtn');
  const email = document.getElementById('fpEmail').value.trim();
  if (!email) { showAlert('alert1', 'Enter your email.'); return; }

  setLoading(btn, true);
  try {
    const res = await api('php/auth.php', { action: 'send_otp', email });
    if (res.success) {
      currentEmail = email;
      document.getElementById('emailDisplay').textContent = email;

      // Show demo OTP (REMOVE IN PRODUCTION)
      if (res.demo_otp) {
        const box = document.getElementById('demoOTPBox');
        box.style.display = 'block';
        document.getElementById('demoOTP').textContent = res.demo_otp;
      }

      showStep(2);
      document.getElementById('o1').focus();
    } else {
      showAlert('alert1', res.message);
    }
  } catch { showAlert('alert1', 'Connection error.'); }
  finally { setLoading(btn, false); }
}

async function resendOTP() { await sendOTP(); }

function otpNext(el, nextId) {
  el.value = el.value.replace(/\D/g, ''); // numbers only
  if (el.value && nextId) document.getElementById(nextId).focus();
}

function otpBack(e, el, prevId) {
  if (e.key === 'Backspace' && !el.value && prevId) document.getElementById(prevId).focus();
}

async function verifyOTP() {
  const btn = document.getElementById('verifyBtn');
  const otp = ['o1','o2','o3','o4','o5','o6'].map(id => document.getElementById(id).value).join('');
  if (otp.length < 6) { showAlert('alert2', 'Enter all 6 digits.'); return; }

  setLoading(btn, true);
  try {
    const res = await api('php/auth.php', { action: 'verify_otp', email: currentEmail, otp });
    if (res.success) {
      showStep(3);
    } else {
      showAlert('alert2', res.message);
    }
  } catch { showAlert('alert2', 'Connection error.'); }
  finally { setLoading(btn, false); }
}

async function resetPassword() {
  const btn  = document.getElementById('resetBtn');
  const pass = document.getElementById('newpass').value;
  const c    = document.getElementById('newpass2').value;

  if (!pass) { showAlert('alert3', 'Enter new password.'); return; }
  if (pass !== c) { showAlert('alert3', 'Passwords do not match.'); return; }

  setLoading(btn, true);
  try {
    const res = await api('php/auth.php', { action: 'reset_password', password: pass });
    if (res.success) {
      showAlert('alert3', '✅ Password reset! Redirecting to login...', 'success');
      setTimeout(() => window.location.href = 'login.html', 1500);
    } else {
      showAlert('alert3', res.message);
    }
  } catch { showAlert('alert3', 'Connection error.'); }
  finally { setLoading(btn, false); }
}

// Style OTP inputs via JS
document.querySelectorAll('.otp-digit').forEach(inp => {
  inp.style.cssText = 'width:48px;height:56px;text-align:center;font-size:22px;font-family:var(--mono);font-weight:700;border-radius:12px;';
});
</script>
</body>
</html>
