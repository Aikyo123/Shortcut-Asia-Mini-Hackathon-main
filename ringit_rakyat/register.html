<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register – RingitRakyat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">💰</div>
      <h1>RingitRakyat</h1>
      <p>Start your money journey today</p>
    </div>

    <h2 class="auth-title">Create Account 🚀</h2>
    <p class="auth-sub">Join thousands of students earning smarter</p>

    <div class="alert" id="alert"></div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Ahmad Rizal" autocomplete="name">
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="student@email.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" autocomplete="new-password">
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm" placeholder="Repeat password">
    </div>

    <button class="btn btn-primary" id="regBtn" onclick="doRegister()">Create Account</button>

    <div class="auth-links">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
async function doRegister() {
  const btn     = document.getElementById('regBtn');
  const name    = document.getElementById('name').value.trim();
  const email   = document.getElementById('email').value.trim();
  const pass    = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (!name || !email || !pass) { showAlert('alert', 'Please fill all fields.'); return; }
  if (pass !== confirm) { showAlert('alert', 'Passwords do not match.'); return; }
  if (pass.length < 6)  { showAlert('alert', 'Password must be at least 6 characters.'); return; }

  setLoading(btn, true);
  try {
    const res = await api('php/auth.php', { action: 'register', name, email, password: pass });
    if (res.success) {
      showAlert('alert', '✅ Account created! Redirecting to login...', 'success');
      setTimeout(() => window.location.href = 'login.html', 1500);
    } else {
      showAlert('alert', res.message);
    }
  } catch (e) {
    showAlert('alert', 'Connection error. Is XAMPP running?');
  } finally {
    setLoading(btn, false);
  }
}
</script>
</body>
</html>
